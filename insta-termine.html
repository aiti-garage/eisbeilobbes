<script>
const MONATE = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const MONATE_LANG = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const WOCHENTAGE = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];

const canvas  = document.getElementById('vorschau');
const hinweis = document.getElementById('hinweis');
const caption = document.getElementById('caption');
const status  = document.getElementById('status');
const auswahl = document.getElementById('auswahl');
const btnTeilen = document.getElementById('btn-teilen');

let einzeltermine = [];         // kommende Termine, jede CSV-Zeile einzeln
let gruppen = [];               // dieselben Termine, mehrtägige zusammengefasst
let aktuellesFormat = 'post';
const bilder = { foto: null, logo: null };

const KALENDER_ICON = '\uf783';     // Font Awesome "calendar-day"
const SYMBOL_FONT = '900 40px "Font Awesome 6 Free"';
let symbolFontDa = false;           // erst nach dem Laden der Icon-Schrift true

/* ---------------- Daten ---------------- */

function parseCSV(text) {
    const zeilen = text.trim().split(/\r?\n/).filter(l => l && !l.startsWith('#'));
    const kopf = zeilen.shift().split(';').map(h => h.trim());
    return zeilen.map(zeile => {
        const spalten = zeile.split(';');
        const o = {};
        kopf.forEach((h, i) => o[h] = (spalten[i] || '').trim());
        return o;
    });
}

// "Rock unter den Eichen - Tag 1 von 2" -> "Rock unter den Eichen"
function ohneTagZaehler(text) {
    return (text || '').replace(/\s*[-–]?\s*Tag\s+\d+\s+von\s+\d+\s*/i, '').trim();
}

function istFolgetag(a, b) {
    return (b - a) / 86400000 === 1;
}

/* Mehrtägige Veranstaltungen am selben Ort zu einem Eintrag zusammenfassen */
function fasseZusammen(termine) {
    const gruppen = [];
    termine.forEach(t => {
        const d = new Date(t.datum);
        const letzte = gruppen[gruppen.length - 1];
        if (letzte && letzte.ort === t.ort && istFolgetag(letzte.bis, d)) {
            letzte.bis = d;
            if (!letzte.beschreibung) letzte.beschreibung = ohneTagZaehler(t.beschreibung);
        } else {
            gruppen.push({
                von: d, bis: d,
                ort: t.ort || '',
                beschreibung: ohneTagZaehler(t.beschreibung),
                uhrzeit: t.uhrzeit || ''
            });
        }
    });
    return gruppen;
}

function datumsFeld(g) {
    const einTag = g.von.getTime() === g.bis.getTime();
    if (einTag) {
        return { tag: String(g.von.getDate()).padStart(2, '0'), monat: MONATE[g.von.getMonth()], klein: false };
    }
    if (g.von.getMonth() === g.bis.getMonth()) {
        return { tag: `${g.von.getDate()}.–${g.bis.getDate()}.`, monat: MONATE[g.von.getMonth()], klein: true };
    }
    return {
        tag: `${g.von.getDate()}.${g.von.getMonth() + 1}.–${g.bis.getDate()}.${g.bis.getMonth() + 1}.`,
        monat: '', klein: true
    };
}

function infoZeile(g) {
    const teile = [];
    if (g.beschreibung) teile.push(g.beschreibung);
    if (g.uhrzeit) teile.push('ab ' + g.uhrzeit + ' Uhr');
    return teile.join('  ·  ');
}

/* ---------------- Canvas-Helfer ---------------- */

function rundesRechteck(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
}

/* Gesperrter Text, mittig um cx. Nutzt ctx.letterSpacing, weil das
   Zeichen-für-Zeichen-Setzen bei kleinen Abständen unsauber aussieht. */
function zeichneGesperrt(ctx, text, cx, y, spacing) {
    const align = ctx.textAlign;
    if ('letterSpacing' in ctx) {
        const vorher = ctx.letterSpacing;
        ctx.letterSpacing = spacing.toFixed(2) + 'px';
        ctx.textAlign = 'center';
        ctx.fillText(text, cx + spacing / 2, y);   // Chrome zählt den Abstand hinter dem letzten Zeichen mit
        ctx.letterSpacing = vorher;
    } else {
        const zeichen = [...text];
        const breite = zeichen.reduce((s, c) => s + ctx.measureText(c).width + spacing, 0) - spacing;
        let x = cx - breite / 2;
        ctx.textAlign = 'left';
        zeichen.forEach(c => {
            ctx.fillText(c, x, y);
            x += ctx.measureText(c).width + spacing;
        });
    }
    ctx.textAlign = align;
}

/* Text auf mehrere Zeilen verteilen (für das Einzeltermin-Bild) */
function umbrechen(ctx, text, maxBreite) {
    const worte = String(text).split(/\s+/);
    const zeilen = [];
    let zeile = '';
    worte.forEach(w => {
        const test = zeile ? zeile + ' ' + w : w;
        if (ctx.measureText(test).width > maxBreite && zeile) {
            zeilen.push(zeile);
            zeile = w;
        } else {
            zeile = test;
        }
    });
    if (zeile) zeilen.push(zeile);
    return zeilen;
}

/* Text mit … abschneiden (für die Zeilen der Übersicht) */
function kuerzen(ctx, text, maxBreite) {
    if (ctx.measureText(text).width <= maxBreite) return text;
    let t = text;
    while (t.length > 1 && ctx.measureText(t + '…').width > maxBreite) t = t.slice(0, -1);
    return t.replace(/[\s.,-]+$/, '') + '…';
}

/* Breite/Höhe des Fotos - bestimmt, wie hoch es bei voller Breite wird */
function seitenverhaeltnis(img) {
    return img ? img.width / img.height : 2752 / 1536;
}

function ladeBild(src) {
    return new Promise(resolve => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
    });
}

function zeichneFoto(ctx, img, x, y, w, h) {
    if (!img) return;
    const off = document.createElement('canvas');
    off.width = w;
    off.height = h;
    const o = off.getContext('2d');
    const scale = Math.max(w / img.width, h / img.height);   // Bild füllt die Fläche
    const bw = img.width * scale;
    const bh = img.height * scale;
    o.drawImage(img, (w - bw) / 2, (h - bh) / 2, bw, bh);

    const g = o.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.18, 'rgba(0,0,0,0)');
    g.addColorStop(0.82, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,1)');
    o.globalCompositeOperation = 'destination-out';
    o.fillStyle = g;
    o.fillRect(0, 0, w, h);

    ctx.drawImage(off, x, y);
}

/* Foto vollständig einpassen, nichts abschneiden, alle vier Kanten weich
   auslaufen lassen, damit es nicht als Rechteck auf dem Hintergrund klebt. */
function zeichneFotoEinpassen(ctx, img, W, top, hoehe, breiteFaktor) {
    if (!img) return;
    const off = document.createElement('canvas');
    off.width = W;
    off.height = hoehe;
    const o = off.getContext('2d');
    const scale = Math.min((W * (breiteFaktor || 0.86)) / img.width, hoehe / img.height);
    const bw = img.width * scale;
    const bh = img.height * scale;
    const links = (W - bw) / 2;
    const oben = (hoehe - bh) / 2;
    o.drawImage(img, links, oben, bw, bh);

    o.globalCompositeOperation = 'destination-out';

    const senkrecht = o.createLinearGradient(0, oben, 0, oben + bh);
    senkrecht.addColorStop(0, 'rgba(0,0,0,1)');
    senkrecht.addColorStop(0.14, 'rgba(0,0,0,0)');
    senkrecht.addColorStop(0.86, 'rgba(0,0,0,0)');
    senkrecht.addColorStop(1, 'rgba(0,0,0,1)');
    o.fillStyle = senkrecht;
    o.fillRect(links, oben, bw, bh);

    const waagerecht = o.createLinearGradient(links, 0, links + bw, 0);
    waagerecht.addColorStop(0, 'rgba(0,0,0,1)');
    waagerecht.addColorStop(0.10, 'rgba(0,0,0,0)');
    waagerecht.addColorStop(0.90, 'rgba(0,0,0,0)');
    waagerecht.addColorStop(1, 'rgba(0,0,0,1)');
    o.fillStyle = waagerecht;
    o.fillRect(links, oben, bw, bh);

    ctx.drawImage(off, 0, top);
}

function zeichneLogo(ctx, img, cx, cy, d) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, d / 2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.clip();
    if (img) {
        // einpassen statt füllen - das Logo ist breit (2752x1536),
        // beim Füllen würde der Schriftzug links und rechts abgeschnitten
        const scale = Math.min(d / img.width, d / img.height);
        const bw = img.width * scale;
        const bh = img.height * scale;
        ctx.drawImage(img, cx - bw / 2, cy - bh / 2, bw, bh);
    }
    ctx.restore();
    ctx.beginPath();
    ctx.arc(cx, cy, d / 2, 0, Math.PI * 2);
    ctx.lineWidth = d * 0.045;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
}

/* ---------------- Bild aufbauen ---------------- */

const FORMATE = {
    post:  { W: 1080, H: 1080 },
    story: { W: 1080, H: 1920 }
};

/* Beim Beitrag füllt die Karte das ganze Bild. Bei der Story ist sie nur so
   hoch wie ihr Inhalt und sitzt mittig - sonst bleibt bei ein, zwei Terminen
   eine große weiße Fläche stehen. Höchstens 1460 hoch und mittig heißt: sie
   bleibt zwischen y=230 und y=1690, wo Instagram nichts überdeckt. */
function karteFuer(format, anzahl) {
    if (format === 'post') return { x: 0, y: 0, w: 1080, h: 1080, r: 0 };

    const w = 1000, s = w / 1080;
    const kopf = Math.round(128 * s) + (w * 0.88) / seitenverhaeltnis(bilder.foto);
    const inhalt = kopf + 84 * s + Math.max(1, anzahl) * 110 * s + 46 * s + 62 * s;
    const h = Math.round(Math.max(820 * s, Math.min(1460, inhalt)));
    return { x: 40, y: Math.round((1920 - h) / 2), w, h, r: 44 };
}

function zeichneBild(format) {
    const F = FORMATE[format];
    canvas.width = F.W;
    canvas.height = F.H;
    const ctx = canvas.getContext('2d');
    const k = karteFuer(format, gruppen.length);
    const s = k.w / 1080;                     // Maßstab der Karte

    // Hintergrund hinter der Karte (nur bei Story sichtbar)
    const bg = ctx.createLinearGradient(0, 0, 0, F.H);
    bg.addColorStop(0, '#fcece0');
    bg.addColorStop(0.5, '#fdfaf0');
    bg.addColorStop(1, '#fcece0');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, F.W, F.H);

    ctx.save();
    rundesRechteck(ctx, k.x, k.y, k.w, k.h, k.r);
    ctx.clip();
    ctx.translate(k.x, k.y);

    const bandH = Math.round(62 * s);

    /* Der Kopfbereich bekommt, was die Terminliste nicht braucht: bei ein,
       zwei Terminen wird das Foto groß, bei einer vollen Liste schrumpft es
       bis zur Untergrenze. Mehr als volle Bildbreite bringt nichts. */
    const fotoOben = Math.round(128 * s);
    const fotoMax = (k.w * 0.88) / seitenverhaeltnis(bilder.foto);
    const untenGrenze = k.h - bandH - Math.round(46 * s);
    const wunschListe = Math.max(1, gruppen.length) * 104 * s;
    const kopfH = Math.round(Math.min(
        fotoOben + fotoMax,
        Math.max(448 * s, untenGrenze - 84 * s - wunschListe)
    ));

    // Grundflächen: weiße Karte, Peach oben, Peach-Band unten
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, k.w, k.h);
    ctx.fillStyle = '#fcece0';
    ctx.fillRect(0, 0, k.w, kopfH);
    ctx.fillRect(0, k.h - bandH, k.w, bandH);

    // Kopfbereich
    ctx.textAlign = 'center';
    ctx.fillStyle = '#d32f2f';
    ctx.font = `italic bold ${Math.round(74 * s)}px Georgia, serif`;
    ctx.fillText('Eis bei Lobbes', k.w / 2, Math.round(120 * s));

    zeichneFotoEinpassen(ctx, bilder.foto, k.w, fotoOben, kopfH - fotoOben, 0.88);
    zeichneLogo(ctx, bilder.logo, Math.round(105 * s), Math.round(105 * s), Math.round(130 * s));

    // Überschrift des Terminblocks, mit Kalender-Symbol wie auf der Website
    const titelGroesse = Math.round(42 * s);
    const titelText = 'Wo ihr uns findet';
    const titelY = kopfH + Math.round(54 * s);
    ctx.fillStyle = '#d32f2f';
    ctx.font = `${titelGroesse}px Georgia, serif`;
    if (symbolFontDa) {
        const iconGroesse = Math.round(titelGroesse * 0.82);
        const textBreite = ctx.measureText(titelText).width;
        ctx.font = `900 ${iconGroesse}px "Font Awesome 6 Free"`;
        const iconBreite = ctx.measureText(KALENDER_ICON).width;
        const luecke = Math.round(14 * s);
        const start = (k.w - (iconBreite + luecke + textBreite)) / 2;
        ctx.textAlign = 'left';
        ctx.fillText(KALENDER_ICON, start, titelY);
        ctx.font = `${titelGroesse}px Georgia, serif`;
        ctx.fillText(titelText, start + iconBreite + luecke, titelY);
        ctx.textAlign = 'center';
    } else {
        ctx.fillText(titelText, k.w / 2, titelY);
    }

    // Fußband
    ctx.fillStyle = '#3e2723';
    ctx.font = `bold ${Math.round(21 * s)}px 'Helvetica Neue', Arial, sans-serif`;
    zeichneGesperrt(ctx, 'Handgemachtes Eis eigener Herstellung',
                    k.w / 2, k.h - bandH / 2 + Math.round(8 * s), Math.max(1, 1.2 * s));

    // Pflichtangabe zum KI-Bild (EU-KI-Verordnung ab 02.08.2026)
    const kiGroesse = Math.round(20 * s);
    ctx.fillStyle = '#a1887f';
    ctx.font = `${kiGroesse}px 'Helvetica Neue', Arial, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(KI_HINWEIS, k.w / 2, k.h - bandH - Math.round(16 * s));

    // Terminzeilen
    const links = Math.round(58 * s);
    const oben = kopfH + Math.round(84 * s);
    const unten = k.h - bandH - Math.round(46 * s);
    const platz = unten - oben;

    if (gruppen.length === 0) {
        ctx.fillStyle = '#8d6e63';
        ctx.font = `italic ${Math.round(30 * s)}px 'Helvetica Neue', Arial, sans-serif`;
        ctx.fillText('Neue Termine folgen in Kürze!', k.w / 2, oben + platz / 2);
        ctx.restore();
        return { gezeigt: 0, rest: 0 };
    }

    const minZeile = 62 * s;
    const passen = Math.max(1, Math.floor(platz / minZeile));
    const zuViel = gruppen.length > passen;
    const anzahl = zuViel ? passen - 1 : gruppen.length;   // eine Zeile für den Hinweis freihalten
    const sichtbar = gruppen.slice(0, Math.max(1, anzahl));
    const rest = gruppen.length - sichtbar.length;

    const zeilenGesamt = sichtbar.length + (rest > 0 ? 1 : 0);
    const zeileH = Math.min(122 * s, platz / zeilenGesamt);
    const rs = Math.max(0.62, Math.min(1, zeileH / (96 * s)));   // Skalierung innerhalb der Zeile

    const boxW = Math.round(92 * s * (0.72 + 0.28 * rs));
    const boxH = Math.round(80 * s * rs);
    const textX = links + boxW + Math.round(24 * s);
    const textMax = k.w - textX - links;

    // wenige Termine: Block mittig im freien Raum statt oben klebend
    let y = oben + Math.max(0, (platz - zeileH * zeilenGesamt) / 2);
    sichtbar.forEach((g, i) => {
        const mitte = y + zeileH / 2;
        const df = datumsFeld(g);

        // rotes Datumsfeld
        ctx.fillStyle = '#d32f2f';
        rundesRechteck(ctx, links, mitte - boxH / 2, boxW, boxH, Math.round(14 * s * rs));
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        const hatMonat = df.monat !== '';
        const tagGroesse = Math.round((df.klein ? 25 : 37) * s * rs);
        ctx.font = `bold ${tagGroesse}px 'Helvetica Neue', Arial, sans-serif`;
        let tagText = df.tag;
        if (ctx.measureText(tagText).width > boxW - 10 * s) {
            ctx.font = `bold ${Math.round(tagGroesse * 0.8)}px 'Helvetica Neue', Arial, sans-serif`;
        }
        ctx.fillText(tagText, links + boxW / 2, hatMonat ? mitte + Math.round(4 * s * rs) : mitte + tagGroesse * 0.35);

        if (hatMonat) {
            ctx.font = `${Math.round(17 * s * rs)}px 'Helvetica Neue', Arial, sans-serif`;
            zeichneGesperrt(ctx, df.monat.toUpperCase(), links + boxW / 2,
                            mitte + Math.round(29 * s * rs), 17 * s * rs * 0.1);
        }

        // Ort + Zusatzinfo
        ctx.textAlign = 'left';
        const info = infoZeile(g);
        const ortGroesse = Math.round(27 * s * rs);
        const infoGroesse = Math.round(21 * s * rs);

        ctx.fillStyle = '#3e2723';
        ctx.font = `bold ${ortGroesse}px 'Helvetica Neue', Arial, sans-serif`;
        const ortY = info ? mitte - Math.round(4 * s * rs) : mitte + ortGroesse * 0.35;
        ctx.fillText(kuerzen(ctx, g.ort, textMax), textX, ortY);

        if (info) {
            ctx.fillStyle = '#6d4c41';
            ctx.font = `${infoGroesse}px 'Helvetica Neue', Arial, sans-serif`;
            ctx.fillText(kuerzen(ctx, info, textMax), textX, ortY + Math.round(30 * s * rs));
        }

        // Trennlinie
        if (i < sichtbar.length - 1) {
            ctx.strokeStyle = '#f4ece0';
            ctx.lineWidth = Math.max(1, 2 * s);
            ctx.beginPath();
            ctx.moveTo(links, y + zeileH);
            ctx.lineTo(k.w - links, y + zeileH);
            ctx.stroke();
        }

        y += zeileH;
    });

    if (rest > 0) {
        ctx.textAlign = 'center';
        ctx.fillStyle = '#8d6e63';
        ctx.font = `italic ${Math.round(23 * s)}px 'Helvetica Neue', Arial, sans-serif`;
        ctx.fillText(`… und ${rest} weitere${rest === 1 ? 'r Termin' : ' Termine'} – alle auf eis-bei-lobbes.de`,
                     k.w / 2, y + zeileH / 2 + Math.round(8 * s));
    }

    ctx.restore();
    return { gezeigt: sichtbar.length, rest };
}

/* ---------------- Einzelner Termin als Bild ---------------- */

/* Story: alles zwischen y≈140 und y≈1670, damit Instagram mit Profilzeile
   oben und Antwort-Leiste unten nichts verdeckt. */
const EINZEL = {
    story: {
        W: 1080, H: 1920,
        logo: { d: 172, x: 540, y: 198 }, titel: 92, titelY: 392,
        kicker: 30, kickerY: 450,
        foto: { top: 480, min: 400, luftDanach: 25 },
        pill: { w: 430, h: 240, r: 40, wtag: 34, tag: 108, monat: 36 },
        ort: 70, besch: 42, zeit: 48, luftMin: 44, abstand: 26,
        fussLinie: 1630, fussY: 1700, fuss: 42, kiY: 1752, ki: 30
    },
    /* Beim Quadrat sitzt das Logo links neben dem Titel statt darüber -
       das spart Höhe, die dem Foto zugute kommt (wie in der Übersicht). */
    post: {
        W: 1080, H: 1080,
        logo: { d: 130, x: 105, y: 105 }, titel: 74, titelY: 122,
        kicker: 24, kickerY: 168,
        foto: { top: 188, min: 200, luftDanach: 20 },
        pill: { w: 336, h: 152, r: 30, wtag: 26, tag: 70, monat: 26 },
        ort: 54, besch: 34, zeit: 38, luftMin: 24, abstand: 18,
        fussLinie: 958, fussY: 1006, fuss: 32, kiY: 1046, ki: 23
    }
};

function zeichneEinzelBild(t, format) {
    const L = EINZEL[format];
    const W = L.W, H = L.H, cx = W / 2;
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');
    const d = new Date(t.datum);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#fcece0');
    bg.addColorStop(0.55, '#fdfaf0');
    bg.addColorStop(1, '#fcece0');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    zeichneLogo(ctx, bilder.logo, L.logo.x, L.logo.y, L.logo.d);

    ctx.fillStyle = '#d32f2f';
    ctx.font = `italic bold ${L.titel}px Georgia, serif`;
    ctx.fillText('Eis bei Lobbes', cx, L.titelY);

    ctx.fillStyle = '#6d4c41';
    ctx.font = `bold ${L.kicker}px 'Helvetica Neue', Arial, sans-serif`;
    zeichneGesperrt(ctx, 'WIR SIND UNTERWEGS', cx, L.kickerY, L.kicker * 0.22);

    // Textblock zuerst vermessen - was er nicht braucht, bekommt das Foto
    const maxB = W * 0.82;
    const bloecke = [];

    // Ort: Schrift verkleinern, bis er in maximal zwei Zeilen passt
    let ortGroesse = L.ort, ortZeilen = [];
    for (const f of [1, 0.85, 0.72, 0.6]) {
        ortGroesse = Math.round(L.ort * f);
        ctx.font = `bold ${ortGroesse}px 'Helvetica Neue', Arial, sans-serif`;
        ortZeilen = umbrechen(ctx, t.ort || '', maxB);
        if (ortZeilen.length <= 2) break;
    }
    bloecke.push({ zeilen: ortZeilen, groesse: ortGroesse, stil: 'bold', farbe: '#3e2723', lh: 1.24 });

    if (t.beschreibung) {
        ctx.font = `italic ${L.besch}px 'Helvetica Neue', Arial, sans-serif`;
        bloecke.push({
            zeilen: umbrechen(ctx, t.beschreibung, maxB),
            groesse: L.besch, stil: 'italic', farbe: '#6d4c41', lh: 1.32
        });
    }

    bloecke.push({
        zeilen: [t.uhrzeit ? `ab ${t.uhrzeit} Uhr` : 'den ganzen Tag'],
        groesse: L.zeit, stil: 'bold', farbe: '#5d4037', lh: 1.3
    });

    const hoehe = bloecke.reduce((s, b) => s + b.zeilen.length * b.groesse * b.lh, 0) +
                  L.abstand * (bloecke.length - 1);

    /* Fotohöhe aus dem Rest: kurzer Ortsname ohne Zusatz -> großes Foto,
       langer Name mit Beschreibung -> das Foto gibt Platz ab. */
    const p = L.pill;
    const fotoMax = (W * 0.92) / seitenverhaeltnis(bilder.foto);
    const fotoH = Math.max(L.foto.min, Math.min(fotoMax,
        L.fussLinie - L.foto.top - L.foto.luftDanach - p.h - 2 * L.luftMin - hoehe));

    zeichneFotoEinpassen(ctx, bilder.foto, W, L.foto.top, fotoH, 0.92);

    // Datums-Pille
    const pillTop = L.foto.top + fotoH + L.foto.luftDanach;
    ctx.fillStyle = '#d32f2f';
    rundesRechteck(ctx, cx - p.w / 2, pillTop, p.w, p.h, p.r);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = `bold ${p.wtag}px 'Helvetica Neue', Arial, sans-serif`;
    zeichneGesperrt(ctx, WOCHENTAGE[d.getDay()].toUpperCase(), cx, pillTop + p.h * 0.25, p.wtag * 0.18);
    ctx.font = `bold ${p.tag}px 'Helvetica Neue', Arial, sans-serif`;
    ctx.fillText(String(d.getDate()), cx, pillTop + p.h * 0.68);
    ctx.font = `${p.monat}px 'Helvetica Neue', Arial, sans-serif`;
    ctx.fillText(`${MONATE_LANG[d.getMonth()]} ${d.getFullYear()}`, cx, pillTop + p.h * 0.90);

    const platz = L.fussLinie - (pillTop + p.h) - L.luftMin;
    const eng = Math.min(1, platz / hoehe);   // Notbremse bei sehr viel Text

    let y = pillTop + p.h + L.luftMin + (platz - hoehe * eng) / 2;
    bloecke.forEach((b, i) => {
        const g = Math.round(b.groesse * eng);
        const zh = g * b.lh;
        ctx.font = `${b.stil} ${g}px 'Helvetica Neue', Arial, sans-serif`;
        ctx.fillStyle = b.farbe;
        b.zeilen.forEach(z => {
            ctx.fillText(z, cx, y + zh * 0.76);
            y += zh;
        });
        if (i < bloecke.length - 1) y += L.abstand * eng;
    });

    // Fußzeile
    ctx.strokeStyle = '#f0e6d2';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W * 0.18, L.fussLinie);
    ctx.lineTo(W * 0.82, L.fussLinie);
    ctx.stroke();

    ctx.fillStyle = '#8d6e63';
    ctx.font = `bold ${L.fuss}px 'Helvetica Neue', Arial, sans-serif`;
    ctx.fillText('@eis.bei.lobbes  ·  Handgemachtes Eis', cx, L.fussY);

    // Pflichtangabe zum KI-Bild (EU-KI-Verordnung ab 02.08.2026)
    ctx.fillStyle = '#a1887f';
    ctx.font = `${L.ki}px 'Helvetica Neue', Arial, sans-serif`;
    ctx.fillText(KI_HINWEIS, cx, L.kiY);

    return { gezeigt: 1, rest: 0 };
}

/* ---------------- Text für die Bildunterschrift ---------------- */

function baueCaptionEinzel(t) {
    const d = new Date(t.datum);
    const datum = `${WOCHENTAGE[d.getDay()]}, ${d.getDate()}. ${MONATE_LANG[d.getMonth()]} ${d.getFullYear()}`;
    const ortWort = (t.ort || '').split(/\s+/).pop().replace(/[^A-Za-zÄÖÜäöüß]/g, '');
    const tags = ['#eisbeilobbes', '#eisbuddy', '#handgemachtesEis', '#Eiszeit', '#Tangerhütte'];
    if (ortWort && !tags.some(x => x.toLowerCase() === '#' + ortWort.toLowerCase())) {
        tags.push('#' + ortWort);
    }
    return [
        '🍦 Unser Eis Buddy ist unterwegs!',
        '',
        '📅 ' + datum,
        t.uhrzeit ? '🕐 ab ' + t.uhrzeit + ' Uhr' : '🕐 den ganzen Tag',
        '📍 ' + (t.ort || ''),
        t.beschreibung ? 'ℹ️ ' + t.beschreibung : '',
        '',
        'Handgemachtes Eis eigener Herstellung – wir freuen uns auf euch!',
        '',
        KI_HINWEIS + '.',
        '',
        tags.join(' ')
    ].filter(z => z !== '').join('\n');
}

function baueCaption() {
    if (gruppen.length === 0) {
        return 'Aktuell haben wir keine Termine geplant – neue Termine folgen in Kürze! 🍦\n\n'
             + KI_HINWEIS + '.\n\n#eisbeilobbes #eisbuddy';
    }
    const zeilen = gruppen.map(g => {
        const einTag = g.von.getTime() === g.bis.getTime();
        const datum = einTag
            ? `${g.von.getDate()}. ${MONATE_LANG[g.von.getMonth()]}`
            : `${g.von.getDate()}.–${g.bis.getDate()}. ${MONATE_LANG[g.bis.getMonth()]}`;
        const zusatz = infoZeile(g).replace(/\s+·\s+/g, ', ');
        return `📅 ${datum} – ${g.ort}${zusatz ? ' (' + zusatz + ')' : ''}`;
    });
    return [
        '🍦 Wo ihr unseren Eis Buddy findet:',
        '',
        ...zeilen,
        '',
        'Handgemachtes Eis eigener Herstellung – wir freuen uns auf euch!',
        '',
        KI_HINWEIS + '.',
        '',
        '#eisbeilobbes #eisbuddy #handgemachtesEis #Eiszeit #Tangerhütte #mobileEisdiele'
    ].join('\n');
}

/* ---------------- Ausgabe / Bedienung ---------------- */

/* null = Übersicht über alle Termine, sonst der gewählte Einzeltermin */
function gewaehlterTermin() {
    return auswahl.value === 'alle' ? null : einzeltermine[+auswahl.value];
}

function alsDateiname(text) {
    return text.toLowerCase()
        .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function dateiname() {
    const t = gewaehlterTermin();
    if (t) {
        return `eis-bei-lobbes_${t.datum}_${alsDateiname(t.ort || 'termin')}_${aktuellesFormat}.png`;
    }
    const h = new Date();
    const datum = `${h.getFullYear()}-${String(h.getMonth() + 1).padStart(2, '0')}-${String(h.getDate()).padStart(2, '0')}`;
    return `eis-bei-lobbes_termine_${datum}_${aktuellesFormat}.png`;
}

function fuelleAuswahl() {
    einzeltermine.forEach((t, i) => {
        const d = new Date(t.datum);
        const o = document.createElement('option');
        o.value = i;
        o.textContent = `${WOCHENTAGE[d.getDay()].slice(0, 2)}., ${d.getDate()}. ${MONATE[d.getMonth()]} – ${t.ort}`
                      + (t.beschreibung ? ` (${t.beschreibung})` : '');
        auswahl.appendChild(o);
    });
}

function aktualisiere() {
    const t = gewaehlterTermin();

    if (t) {
        zeichneEinzelBild(t, aktuellesFormat);
        caption.value = baueCaptionEinzel(t);
        hinweis.textContent = 'Einzelner Termin. Über „Motiv“ wechselst du den Termin oder zur Übersicht.';
        return;
    }

    const ergebnis = zeichneBild(aktuellesFormat);
    caption.value = baueCaption();
    if (gruppen.length === 0) {
        hinweis.textContent = 'Aktuell sind keine kommenden Termine in termine.csv eingetragen.';
    } else if (ergebnis.rest > 0) {
        hinweis.textContent = `${gruppen.length} kommende Termine – auf dem Bild passen ${ergebnis.gezeigt} davon.`;
    } else {
        hinweis.textContent = `${gruppen.length} kommende${gruppen.length === 1 ? 'r Termin' : ' Termine'} aus termine.csv.`;
    }
}

function holeBlob() {
    return pngMitKennzeichnung(canvas);   // aus ki-hinweis.js
}

auswahl.addEventListener('change', () => {
    status.textContent = '';
    aktualisiere();
});

document.querySelectorAll('.format-tab').forEach(btn => {
    btn.addEventListener('click', () => {
        aktuellesFormat = btn.dataset.format;
        document.querySelectorAll('.format-tab').forEach(b => b.classList.toggle('aktiv', b === btn));
        aktualisiere();
    });
});

document.getElementById('btn-bild').addEventListener('click', async () => {
    try {
        const blob = await holeBlob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = dateiname();
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        status.textContent = 'Bild gespeichert ✓';
    } catch (err) {
        status.textContent = 'Bild konnte nicht erzeugt werden – bitte Screenshot nutzen.';
    }
});

document.getElementById('btn-teilen').addEventListener('click', async () => {
    try {
        const blob = await holeBlob();
        const datei = new File([blob], dateiname(), { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [datei] })) {
            await navigator.share({ files: [datei], text: caption.value });
            status.textContent = '';
        } else {
            status.textContent = 'Teilen wird hier nicht unterstützt – bitte Bild speichern.';
        }
    } catch (err) {
        if (err && err.name !== 'AbortError') status.textContent = 'Teilen abgebrochen.';
    }
});

document.getElementById('btn-text').addEventListener('click', async () => {
    try {
        await navigator.clipboard.writeText(caption.value);
    } catch (err) {
        caption.select();
        document.execCommand('copy');
    }
    status.textContent = 'Text kopiert ✓';
});

/* ---------------- Start ---------------- */

/* termine.csv ist die Quelle. Per file:// blockiert der Browser fetch(),
   dann greift die Kopie aus termine.js. */
function ladeTermine() {
    return fetch('termine.csv?v=' + Date.now())
        .then(r => r.ok ? r.text() : Promise.reject(r.status))
        .catch(() => window.TERMINE_CSV || null)
        .then(text => text ? parseCSV(text) : null);
}

/* Icon-Schrift laden, damit das Kalendersymbol auch im Canvas erscheint */
function ladeSymbolFont() {
    if (!document.fonts) return Promise.resolve();
    return document.fonts.load(SYMBOL_FONT, KALENDER_ICON)
        .then(() => { symbolFontDa = document.fonts.check(SYMBOL_FONT); })
        .catch(() => { symbolFontDa = false; });
}

Promise.all([
    ladeBild('eis-buddy-offen.jpg'),
    ladeBild('insta-logo-clean.png'),
    ladeTermine(),
    ladeSymbolFont()
]).then(([foto, logo, termine]) => {
    bilder.foto = foto;
    bilder.logo = logo;

    if (!termine) {
        hinweis.textContent = 'termine.csv konnte nicht geladen werden.';
        zeichneBild(aktuellesFormat);
        return;
    }

    const heute = new Date();
    heute.setHours(0, 0, 0, 0);
    einzeltermine = termine
        .filter(t => t.datum && new Date(t.datum) >= heute)
        .sort((a, b) => new Date(a.datum) - new Date(b.datum));

    gruppen = fasseZusammen(einzeltermine);
    fuelleAuswahl();
    btnTeilen.hidden = !(navigator.share && navigator.canShare);
    aktualisiere();

    // Per file:// darf der Browser das Bild nicht aus dem Canvas lesen
    if (location.protocol === 'file:') {
        status.textContent = 'Hinweis: Speichern klappt nur online bzw. über einen Webserver.';
    }
});
